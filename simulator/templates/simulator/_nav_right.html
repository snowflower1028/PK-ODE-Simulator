{% comment %}
  메뉴바 오른쪽 무리. 어느 페이지에서나 같은 자리에 같은 것이 있어야 하므로
  한 곳에 둔다. margin-left:auto 는 이 상자에 걸려 있어서, 안에 무엇이 몇 개
  들어가든 무리째 끝에 붙는다.

  도구 페이지에서는 home 을 넘긴다:
      {% include "simulator/_nav_right.html" with home=True %}

  <a class="app-nav-link" href="{% url 'home' %}" title="Back to the tool list">
    <i class="bi bi-house" aria-hidden="true"></i>
    <span class="app-nav-text">Home</span>
  </a>
  {% endif %}
  <a class="app-nav-link" href="https://github.com/snowflower1028/PK-ODE-Simulator"
     target="_blank" rel="noopener" title="Source code on GitHub">
    <i class="bi bi-github" aria-hidden="true"></i>
    <span class="app-nav-text">GitHub</span>
  </a>
</div>
