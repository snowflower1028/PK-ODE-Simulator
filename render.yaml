services:
  - type: web
    name: pk-ode-simulator
    runtime: python
    # starter = 0.5 CPU / 512MB ($7). 대시보드에서 바꿨다면 이 파일도 같이
    # 바꿔야 한다 — Blueprint 로 관리되는 서비스는 다음 배포 때 이 값으로
    # 되돌아간다.
    #
    # 실측 (배포 후 부하 테스트, 싱가포르 리전 · 왕복 0.119s 를 뺀 서버 몫):
    #   simulate 1-comp 200점   36ms      (로컬 풀 CPU 22ms 의 1.6배)
    #   sweep 7점               205ms
    #   sweep 40점(상한)        1.45s     — 워커 하나를 그동안 붙잡는다
    #   처리량은 동시 4에서 12.7 req/s 로 최대, 동시 8 에서 9.7 로 꺾인다
    #   385 요청 동안 오류 0, 지연이 시간에 따라 나빠지지도 않았다
    #   (--max-requests 300 재활용도 눈에 띄지 않게 지나갔다)
    #
    # 워커 2개가 사 주는 것: 40점 스윕이 도는 동안에도 다른 사람의 시뮬레이션이
    # p50 0.235s 로 돈다(단독 0.153s 의 1.5배). 워커가 하나면 그 1.5초를 매번
    # 통째로 기다린다. 반대로 스윕 두 개가 동시에 돌면 두 워커가 다 물려
    # 시뮬레이션이 p50 0.68s 로 밀린다 — 수업에서 여럿이 큰 스윕을 동시에
    # 돌리면 느려지는 지점이 여기다.
    plan: starter
    region: singapore
    branch: main
    buildCommand: "./build.sh"
    # --workers 2: 워커 하나가 171MB 상주한다(그중 122MB 가 numpy/scipy/
    #   sympy/pandas import). 3개면 514MB 로 512MB 상한을 그대로 넘는다.
    # --preload: 앱을 fork 전에 한 번만 올려 라이브러리 페이지를 워커끼리
    #   공유하게 한다. 참조계수가 페이지를 조금씩 갈라놓지만
    #   --max-requests 재활용이 주기적으로 되돌린다.
    # --threads 1: 적분이 워커당 직렬화되므로 스레드를 늘려도 얻는 게 없다.
    startCommand: >-
      gunicorn pk_simulator.wsgi:application
      --preload
      --workers 2
      --threads 1
      --timeout 180
      --graceful-timeout 30
      --max-requests 300
      --max-requests-jitter 50
      --access-logfile -
      --error-logfile -
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_LOG_LEVEL
        value: "INFO"
